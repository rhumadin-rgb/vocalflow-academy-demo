<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>로그인 | 보컬플로우</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./styles.css?v=20261019-8" />
  </head>
  <body class="auth-page-body">
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="authTitle">
        <a class="auth-brand" href="./index.html" aria-label="보컬플로우">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>vocalflow</strong><small>MUSIC STUDIO</small></span>
        </a>
        <p class="eyebrow">STUDIO MANAGEMENT</p>
        <h1 id="authTitle">로그인</h1>
        <p class="auth-intro" id="authIntro">등록된 이메일 계정으로 로그인하세요.</p>
        <form id="authLoginForm" class="auth-form">
          <label for="authEmail">이메일</label>
          <input id="authEmail" name="email" type="email" autocomplete="username" maxlength="254" required />
          <label for="authPassword">비밀번호</label>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" required />
          <button class="button primary auth-submit" type="submit">로그인</button>
          <button class="auth-link" type="button" data-auth-view="reset">비밀번호를 잊으셨나요?</button>
        </form>
        <form id="authResetForm" class="auth-form" hidden>
          <p class="auth-intro">가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
          <label for="resetEmail">이메일</label>
          <input id="resetEmail" name="email" type="email" autocomplete="email" maxlength="254" required />
          <button class="button primary auth-submit" type="submit">재설정 링크 보내기</button>
          <button class="auth-link" type="button" data-auth-view="login">로그인으로 돌아가기</button>
        </form>
        <form id="authUpdateForm" class="auth-form" hidden>
          <p class="auth-intro">새 비밀번호는 12자 이상 128자 이하로 설정하세요.</p>
          <label for="newPassword">새 비밀번호</label>
          <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
          <label for="confirmPassword">새 비밀번호 확인</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
          <button class="button primary auth-submit" type="submit">비밀번호 변경</button>
        </form>
        <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
        <p id="authDemoWarning" class="auth-demo-warning" hidden></p>
        <a class="auth-demo-link" id="authDemoLink" href="./index.html">데모 화면으로 돌아가기</a>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./auth.js?v=20261019-8"></script>
  </body>
</html>
